<ng-container *ngIf="shouldShowNavbar()">
  <nav class="modern-navbar navbar navbar-expand-lg sticky-top">
    <div class="container-fluid">
      <!-- Brand & Logo -->
      <a class="navbar-brand d-flex align-items-center" routerLink="/index">
        <div class="brand-icon">
          <i class="bi bi-shield-check"></i>
        </div>
        <div class="brand-text">
          <span class="brand-title">{{
            proyectName || "Bienestar Social"
          }}</span>
          <span class="brand-subtitle">Sistema de Ficha Social</span>
        </div>
      </a>

      <!-- Mobile Toggle Button -->
      <button
        class="navbar-toggler modern-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarResponsive"
        aria-controls="navbarResponsive"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="toggler-icon">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>

      <!-- Navbar Links & Actions -->
      <div
        class="collapse navbar-collapse justify-content-end"
        id="navbarResponsive"
      >
        <div class="navbar-actions">
          <!-- Current Route Indicator (Desktop) -->
          <div class="nav-route-indicator d-none d-lg-flex align-items-center">
            <i class="bi bi-geo-alt-fill"></i>
            <span>{{ _router.url }}</span>
          </div>

          <!-- Divider -->
          <div class="nav-divider d-none d-lg-block"></div>

          <!-- Logout Button -->
          <button type="button" class="btn-logout" (click)="cerrarSession()">
            <span class="btn-icon">
              <i class="bi bi-box-arrow-right"></i>
            </span>
            <span class="btn-text">Cerrar Sesión</span>
          </button>
        </div>
      </div>
    </div>
  </nav>
</ng-container>
